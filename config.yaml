api:
  binance_rest_url: https://api.binance.com
  binance_ws_url: wss://stream.binance.com:9443/stream
  clob_burst: 10
  clob_rate_limit: 5
  clob_url: https://clob.polymarket.com
  gamma_burst: 20
  gamma_rate_limit: 10
  gamma_url: https://gamma-api.polymarket.com
  max_retries: 5
  retry_base_delay: 1.0
  retry_max_delay: 60.0
dry_run: false
kill_switch:
  max_consecutive_losses: 10
  max_drawdown: -20.0
logging:
  backup_count: 5
  file_level: DEBUG
  level: INFO
  log_file: data/logs/bot.log
  max_bytes: 10485760
paper_mode: false
shield:
  cancel_timeout_ms: 500
  enabled: true
  threshold: 0.001
timing:
  display_interval: 10
  health_write_interval: 30
  market_fetch_interval: 3
  metrics_write_interval: 60
  order_check_interval: 2
  scan_interval: 30
  shutdown_timeout: 10
  stale_feed_timeout: 30
trading:
  spread_capture_enabled: false
  allowed_assets:
  - BTC
  - ETH
  allowed_timeframes:
  - 5m
  cancel_time_remaining: 15
  max_orders_per_window: 1
  max_position: 20.0
  max_single_exposure: 20.0
  min_spread_profit: 0.03
  order_size: 5.0
  max_concurrent_pairs: 2
  rechase_enabled: true
  stop_loss_enabled: true

# Arb engine config
arb:
  enabled: false
  order_size: 5.0
  max_exposure: 10.0
  min_edge: 0.04
  cooldown_seconds: 15
  move_threshold_pct: 0.2
  time_weight_early: 0.3
  time_weight_late: 0.7
  sell_discount_from_fair: 0.02
  sell_timeout_seconds: 45

# Late snipe — incremental limit buys in final seconds
snipe:
  enabled: true
  min_buy_price: 0.90                  # global fallback
  min_buy_price_btc: 0.90              # BTC: 90c minimum
  min_buy_price_eth: 0.90              # ETH: 90c minimum
  min_buy_price_eth_afterhours: 0.90   # ETH: 90c after hours
  max_buy_price: 0.97                  # cap at 97c (98-99c = bad risk/reward)
  order_size_dollars: 0                # 0 = use min_shares (5 shares per entry)
  min_dollar_move: 0
  dollar_move_btc: 20                  # BTC: require $20 move from round open
  dollar_move_eth: 0
  dollar_move_sol: 0
  eth_pct_move_from_open: 0.05         # ETH: require 0.05% move from round open (~$1)
  disabled_assets: ["SOL"]
  trading_start_hour_et: 6
  trading_end_hour_et: 19
  trading_end_minute_et: 30
  eth_24h: true                        # ETH runs 24/7
  btc_24h: true                        # BTC runs 24/7 — 90c min + $50 move filter handles selectivity
  eth_overnight_start_et: 2            # kept for reference (unused when eth_24h: true)
  eth_overnight_end_et: 5
  maker_bid_offset: 0.01
  min_edge: 0.01
  entry_times: [17, 11, 6]
  min_shares: 5                        # 5 shares per entry
  max_concurrent: 2                    # 2 concurrent windows (safe at current balance)
  max_entries_per_window: 2            # HARD CAP: 2 snipes per window only
  cooldown_seconds: 4.0
  snipe_window_seconds: 17
  taker_seconds_remaining: 6
  min_seconds_remaining: 3
