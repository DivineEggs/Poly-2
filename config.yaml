api:
  binance_rest_url: https://api.binance.com
  binance_ws_url: wss://stream.binance.com:9443/stream
  clob_burst: 10
  clob_rate_limit: 5
  clob_url: https://clob.polymarket.com
  gamma_burst: 20
  gamma_rate_limit: 10
  gamma_url: https://gamma-api.polymarket.com
  max_retries: 5
  retry_base_delay: 1.0
  retry_max_delay: 60.0
dry_run: false
kill_switch:
  max_consecutive_losses: 10
  max_drawdown: -20.0
logging:
  backup_count: 5
  file_level: DEBUG
  level: INFO
  log_file: data/logs/bot.log
  max_bytes: 10485760
paper_mode: false
shield:
  cancel_timeout_ms: 500
  enabled: true
  threshold: 0.001
timing:
  display_interval: 10
  health_write_interval: 30
  market_fetch_interval: 3
  metrics_write_interval: 60
  order_check_interval: 2
  scan_interval: 30
  shutdown_timeout: 10
  stale_feed_timeout: 30
trading:
  spread_capture_enabled: false
  allowed_assets:
  - BTC
  - ETH
  allowed_timeframes:
  - 5m
  cancel_time_remaining: 15
  max_orders_per_window: 1
  max_position: 10.0
  max_single_exposure: 10.0
  min_spread_profit: 0.03
  order_size: 5.0
  # One trade at a time (low capital mode)
  max_concurrent_pairs: 1
  rechase_enabled: true
  stop_loss_enabled: true

# Arb engine config
arb:
  enabled: false
  order_size: 5.0
  max_exposure: 10.0
  min_edge: 0.04
  cooldown_seconds: 15
  move_threshold_pct: 0.2
  time_weight_early: 0.3
  time_weight_late: 0.7
  sell_discount_from_fair: 0.02
  sell_timeout_seconds: 45

# Late snipe — incremental limit buys in final seconds
snipe:
  enabled: true
  min_buy_price: 0.79       # global fallback
  min_buy_price_btc: 0.85              # BTC: 85c minimum
  min_buy_price_eth: 0.79              # ETH: 79c during golden hours
  min_buy_price_eth_afterhours: 0.88   # ETH: 88c after 8:30PM ET (after hours)
  min_dollar_move: 0        # disabled — price floor handles filtering
  dollar_move_btc: 0        # BTC: min price 85c is the filter
  dollar_move_eth: 0        # ETH: min price 79c/88c is the filter
  dollar_move_sol: 0        # SOL: disabled entirely
  disabled_assets: ["SOL"]  # SOL disabled entirely
  trading_start_hour_et: 6    # Start at 6:00 AM ET
  trading_end_hour_et: 19     # Stop at 7:30 PM ET (volatile evening excluded)
  trading_end_minute_et: 30
  eth_overnight_start_et: 2   # ETH overnight window: 2AM ET
  eth_overnight_end_et: 5     # ETH overnight window: ends 5AM ET (100% win rate)
  max_buy_price: 0.99
  maker_bid_offset: 0.01    # bid 1c below ask (limit/maker order)
  min_edge: 0.01
  entry_times: [17, 11, 6]  # fire entries at these seconds remaining
  min_shares: 5             # polymarket minimum order size
  max_concurrent: 2
  max_entries_per_window: 1   # 1 entry per window — protects bankroll at current size
  cooldown_seconds: 4.0       # min seconds between entries on same window
  snipe_window_seconds: 17    # start scanning 17s before round end
  taker_seconds_remaining: 6  # use taker at <=6s remaining
  min_seconds_remaining: 3
